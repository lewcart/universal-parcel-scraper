            if (zindex == 2) { divloop += '</div>'; } //looping group end

            divhtml += divloop;
            zindex += 1;

            if (sno == 0) {
                $(".last-status").html("<span class='langlbl' langtag='event_" + 91+"'>In Transit - Loaded to Transit Vehicle/Aircraft</span>");
                $(".last-location").html("Samplehub - MALAYSIA");
                    
                    $(".last-notes").html(""); $(".last-notes").show(); 
                    
            }
            sno += 1;

              //For Each TrackingResponseDetails

            if (zindex > 1) {
                //divhtml += '    <hr />';
                divhtml += '    <center><a class="card-link hdnfirstmile hdnfirstmile" data-toggle="collapse" href="#hdnfirstmile" role="button" aria-expanded="false" aria-controls="hdnfirstmile">Show all events</a></center>';
            }

            divhtml += '  </div>';//card-body
            divhtml += '</div>';//collapse show
            divhtml += '</div>';//card card-default
            
            $(".tracking-events").append(divhtml);

           

            $(".hdntoggle").click(function () {
                if ($(this).attr("aria-expanded") == "true") {
                    $(this).html("Show all events");
                } else {
                    $(this).html("Hide events");
                }
            });

            if ($(".nav-item").find("a:visible").length == 1) {
                $("#trackingmenubar").hide();
                $(".tracking-top-header").hide();
            } else {
                $(".trackingstatus-connote .cn").html("&nbsp;");
                $(".trackingstatus-connote .cn1").html("&nbsp;");
            }
            
            $(".hdnintransit").click();
            
        }

        function VerifyNow(stg) {
            $("#hddn_stg").val(stg);
        }
    </script>
  </body>
</html>
