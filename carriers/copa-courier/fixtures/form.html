<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copa Courier | Envíos Rápidos y Seguros a Nivel Internacional</title>
</head>
<body>
    <div class="language-switcher">
    <form method="post" action="/Home/ManejadorLenguaje?urlRetorno=~%2F">
        <select name="lenguaje" onchange="this.form.submit();" data-val="true" data-val-required="The Name field is required." id="lenguaje_RequestCulture_UICulture_Name"><option selected="selected" value="es">ES</option>
<option value="en">EN</option>
</select>
    <input name="__RequestVerificationToken" type="hidden" value="CfDJ8SYNTHETICLANGUAGEFORMxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" /></form>
    </div>
    <ul class="navigation">
        <li><a onclick="window.open('https://extranet.example.com', '_blank');">Mi Copa Courier</a></li>
    </ul>

    <!-- Tracking Section -->
    <section class="tracking-section pull-down">
        <div class="auto-container">
            <div id="trkfrm" class="tracking-form">
                <!-- Tracking Form -->

                <form method="post" target="_blank" action="/Hawb/Hawb">
                    
                    <div class="row">
                        <div class="form-group col-lg-8 col-md-12 col-sm-12">
                            <textarea name="txtNumeroHAWB" placeholder="Introduzca un número HAWB" id="numerohawb"></textarea>
                            <button type="submit" class="theme-btn btn-style-one"><span class="btn-title">Seguimiento</span></button>
                        </div>
                        <!-- Form Group -->
                    </div>
                <input name="__RequestVerificationToken" type="hidden" value="CfDJ8SYNTHETICTRACKINGFORMaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa_bbbbbbbbbbbb-cccc" /></form>
                <!-- End Tracking Form -->
            </div>
        </div>
    </section>
    <!-- End Tracking Section -->

    <section class="contact-section">
			<form id="contact_form" name="contact_form">
							<input name="Nombre" class="form-control" type="text" placeholder="Inserte el nombre">
							<input name="Email" class="form-control required email" type="email" placeholder="Inserte el Email">
					<textarea name="Mensaje" class="form-control required" rows="5" placeholder="Inserte el mensaje"></textarea>
					<input name="form_botcheck" class="form-control" type="hidden" value="" />
			</form>
    </section>
<script src="/js/jquery.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
