<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track & Trace - Cyprus Post</title>
    <meta property="og:url" content="https://www.cypruspost.post/en/track-n-trace-results"/>
</head>
<body>
<form action="https://www.cypruspost.post/en/search" method="GET">
    <input type="text" name="q" placeholder="Search">
</form>
<div class="container">
    <h2>Track &amp; Trace</h2>
    <p style="padding-bottom: 40px;">Important announcements: an example notice about the form of foreign numbers.</p>
<form action="https://www.cypruspost.post/track-and-trace/find" method="POST" id="track-n-trace-form">
    <div id="wegrdlk_SyntheticHoneypot_wrap"  style="display: none" aria-hidden="true">
        <input id="wegrdlk_SyntheticHoneypot"
               name="wegrdlk_SyntheticHoneypot"
               type="text"
               value=""
               autocomplete="nope"
               tabindex="-1">
        <input name="valid_from"
               type="text"
               value="eyJpdiI6IlN5bnRoZXRpY0l2IiwidmFsdWUiOiJTeW50aGV0aWMiLCJtYWMiOiIwMDAwIiwidGFnIjoiIn0="
               autocomplete="off"
               tabindex="-1">
    </div>
    <input type="hidden" name="_token" value="SyntheticFormToken0000000000000000000000" autocomplete="off">    <div class="row">
        <div class="col-sm-9">
            <div class="form-group">
                <input type="text" name="code" class="form-control input-lg" placeholder="You can enter up to five tracking numbers without spaces, separated by “,”, eg.ΧΧ123456789ΧΧ, ΧΧ123456789ΧΧ etc">
            </div>
        </div>
        <div class="col-sm-3">
            <button type="submit" class="btn btn-xl btn-default btn-block">Trace</button>
        </div>
    </div>
</form>
</div>
</body>
</html>
