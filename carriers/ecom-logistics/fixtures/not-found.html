<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track a Shipment · Ecom Logistics</title>
</head>
<body>
<main id="main" >
<section class="sec sec--tight sec--ground" data-track-result="not_found">
        <div class="rail">
                            <div class="max-w-2xl">
                                            <p class="type-small text-ink-soft">
                            Tracking number
                            <span class="track-code">E00A0000099</span>
                        </p>
                                        <h1 class="type-h2 mt-4" data-entry="heading">We could not find that number</h1>
                    <p class="type-lead mt-5 text-ink-soft" data-entry="copy">Check it against your shipping confirmation and try again. A new number can take a few hours to appear after the label is printed.</p>

                                    </div>
            
            
            <div class="mt-10 max-w-lg border-t border-hairline pt-8">
                <h2 class="type-h4">Track another parcel</h2>
                <div class="mt-4">
                    <form method="POST"
      action="https://shipecom.com/track"
      
      data-tracking-form
      novalidate>
    <input type="hidden" name="_token" value="synthetic-form-token" autocomplete="off">
    
    <div class="flex flex-col gap-3">
        <div class="relative flex-1">
            <label for="tracking_number" class="sr-only">Tracking number</label>

            <div class="tracking-field flex items-stretch gap-2 overflow-hidden rounded-lg border bg-white pl-4 border-slab-200"
                 data-tracking-field>
                <svg aria-hidden="true"></svg>
                <input id="tracking_number"
                       name="tracking_number"
                       type="text"
                       inputmode="latin"
                       autocomplete="off"
                       spellcheck="false"
                       placeholder="Enter your tracking number"
                       
                       value="E00A0000099"
                                              class="min-w-0 flex-1 bg-transparent py-3 text-sm text-navy-900 placeholder:text-ink-muted focus:outline-none">

                
                <button
            type="submit"
        class="btn btn-primary min-h-12 px-7 text-base btn--square shrink-0" data-tracking-submit="data-tracking-submit"
    data-button
    >

    <span>Track</span>

            
        <svg aria-hidden="true"></svg>
    
    </button>
            </div>

            
            <div aria-hidden="true" class="absolute inset-x-0 top-full mt-2 h-0.5 overflow-hidden rounded-full bg-slab-200 opacity-0 transition-opacity duration-200"
                 data-tracking-progress-track>
                <span class="tracking-progress block h-full w-full bg-ecom-500" data-tracking-progress></span>
            </div>
        </div>
    </div>

    </form>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
