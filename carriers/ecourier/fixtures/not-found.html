<!doctype html>
<html lang="en-US" class="no-js no-svg">
<head>
<meta charset="UTF-8">
<title>Tracking  |  </title>
<link rel="canonical" href="https://ecourier.com.bd/tracking/" />
</head>
<body class="page-39 page-tracking">
<script>
function trackingFrom() {
    var val = $('#trackForm [name="tracking_item"]').val();
    window.location = '/tracking?tracking_no=' + val;
}
</script>

<section class="track">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="track-product">
                    <h2 class="common-heading">Shipment <span>Tracking</span></h2>
                    <p>Track your parcel</p>
                    <div class="home-track-inner">
                        <form method="post" id="trackForm" onsubmit="trackingFrom(); return false;">
                            <input type="text" name="tracking_item" placeholder="Type your tracking number"
                                class="form-control">
                            <button type="submit" class="common-btn"> <i class="icon-search"></i> <span>TRACK
                                    PARCEL</span> </button>
                        </form>
                    </div>
                    <h5 class="tracking_error" style="display:none;color:red;text-align: left;">Tracking number starts
                        with ECR or BL and minimum 11 characters
                    </h5>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-9">
                                <div class="track-not-found">
                    <h3>No Result Found</h3>
                    <h4>We can’t find any results based on your search.</h4>
                </div>
                            </div>
        </div>

    </div>
    <div class="skew-box be-animated"><span class="circle"></span></div>
</section>
<section class="track-app be-animated">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6 text-center">
<h3>Interested to know more?</h3>
<a class="btn-link" href="https://ecourier.com.bd/contact-us/">contact us</a>
</div>
        </div>
    </div>
</section>
</body>
</html>
