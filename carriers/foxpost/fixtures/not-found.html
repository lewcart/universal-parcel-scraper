<!DOCTYPE html>
<html lang="hu-HU" class="no-js">
<head>
<meta charset="UTF-8">
<title>Csomagkövetés - FOXPOST</title>
</head>
<body>
<!-- Synthetic: the tracker's page for a number it does not know. -->
<main role="main" class="container-fluid">
<div class="parcel-tracking-form">
        <form id="form-parcel-tracking" class="parcel-tracking-form__form" action="/csomagkovetes/" method="GET">        <div class="form-group field-parceltrack-identifier required validating">
            <div class="input-group input-group-lg">
                <input type="text" class="parcel-tracking-form__input no-line" name="code" value="" placeholder="CLFOX...vagy 66639">                <div class="input-group-append">
                    <button type="submit" class="input-group-text parcel-tracking-form__btn btn-red-featured">Megnézem</button>
                </div>
            </div>
        </div>
        </form>
        <div class="parcel-tracking__help mb-2">
            Ha automatába vagy átvevőhelyre kérted csomagod írd ide a CLFOX vagy Z betűkkel kezdődő csomagazonosítód!
        </div>
</div>
    <div class="row">
        <div class="col-12">
            <div class="warning-box">
                A megadott csomag azonosító nem található a rendszerünkben, kérjük ellenőrizd a megadott adatokat            </div>
        </div>
    </div>
</main>
</body>
</html>
