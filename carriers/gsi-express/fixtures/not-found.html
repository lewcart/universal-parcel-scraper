<script>
function BrnshpInfo(x,y){
    var brnNm  = x;
    var brnTel = y;
    var pointX = event.clientX+100;
    var pointY = event.clientY;
    var url    = 'http://www.hydex.net/ehydex/jsp/home/distribution/tracking/tracingPopup.jsp?BrnshpNm='+brnNm+'&BrnshpTel='+brnTel;
    var name   = 'popup';
    var option = 'left='+pointX+',top='+pointY+',width=380,height=200';
    window.open(url,name,option);
}
</script>
</head>

<style>
.popbox {
	display: none;
	position: absolute;
	z-index: 99999;
	width: 300px;

	background: #EEEFEB;

	border: 1px solid #4D4F53;

	box-shadow: 0px 0px 5px 0px rgba(164, 164, 164, 1);
}

.popbox h2 {
	background-color: #4D4F53;
	color: #E3E5DD;
	font-size: 1em;
	font-weight: normal;
	display: block;
	width: 100%;
	margin: -10px 0px 8px -10px;

}

<script type="text/javascript" src="/js/jquery-1.7.1.min.js"></script>
<script>
function multi_ship_num(iframe_name, ship_company_cd, tracking_num)
{
	document.getElementById(iframe_name).src="/tracking_kor.php?view_mode=show&multi_flag=Y&&ship_company_cd="+ ship_company_cd +"&tracking_num=" + tracking_num +"&iframe_name=" + iframe_name; 
}
function screenPop(url,name,scrollbars,width,height)
{
	var window_left = (screen.width-width)/2;
	var window_top = (screen.height-height)/2;
	window.open(url,name,'width='+ width +',height='+ height +',scrollbars='+ scrollbars +',resizable=yes,status=no,top=' + window_top + ',left=' + window_left + '');
}
</script>
