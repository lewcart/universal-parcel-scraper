<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-tw" lang="zh-tw">
<head>
    <meta name="viewport" content="width=device-width, inital-scale=0.66, maximum-scale=1, user-scalable=yes" />
    <meta name="robots" content="noindex">
    <title>新竹物流 貨物追蹤查詢</title>
    <link rel="stylesheet" href="../CSS/jquery.mobile-1.3.2.min.css">
    <script src="../JS/jquery-1.10.2.min.js"></script>
    <script src="../JS/jquery.mobile-1.3.2.min.js"></script>
    <script>
        function clickButton(e, buttonid) {
            var evt = e ? e : window.event;
            var bt = document.getElementById(buttonid);
            if (bt) {
                if (evt.keyCode == 13) {
                    bt.click();
                    return false;
                }
            }
        }
    </script>
</head>

<body>
    <form name="form1" method="post" action="searchGoods_index.aspx" id="form1">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="U3ludGhldGljIHZpZXcgc3RhdGUgKyBzbGFzaC8=" />

<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="0A1B2C3D" />
<input type="hidden" name="__EVENTVALIDATION" id="__EVENTVALIDATION" value="U3ludGhldGljIGV2ZW50IHZhbGlkYXRpb24=" />
        <div data-role="content" >
            <div data-role="header" data-theme="c" style="margin:-15px -15px 0px -15px" >
                <h3>貨物追蹤查詢</h3>
            </div>
                <label for="txtpKey2" class="ui-hidden-accessible">輸入查貨碼10碼</label>
                <input name="txtpKey2" type="text" maxlength="10" id="txtpKey2" name="txtpKey2" placeholder="輸入查貨碼10碼" onkeypress="return clickButton(event,'Button1')" />
                    
                <input type="button" name="Button1" value="查詢" onclick="javascript:__doPostBack('Button1','')" id="Button1" data-theme="e" />
            <div data-role="header" data-theme="c" style="margin:0px -15px">
                <h3>全球通貨況查詢</h3>
            </div>
                <label for="TextBox3" class="ui-hidden-accessible">輸入訂單編號</label>
                <input name="TextBox3" type="text" maxlength="20" id="TextBox3" name="TextBox3" placeholder="輸入訂單編號" onkeypress="return clickButton(event,'global_btn')" />

                <label for="TextBox4" class="ui-hidden-accessible">輸入收件人電話/特約帳號</label>
                <input name="TextBox4" type="text" maxlength="15" id="TextBox4" name="TextBox4" placeholder="輸入收件人電話/特約帳號" onkeypress="return clickButton(event,'global_btn')" />

                <input type="button" name="global_btn" value="查詢" onclick="javascript:__doPostBack('global_btn','')" id="global_btn" data-theme="e" />

                <div id="Panel1">
	
                
</div>
            <div><img alt="" src="../images/app/searchGoods_Main_Car.png" style="width:130px; margin-top:10px; float:right" /></div>
        </div>
