<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jeebly-tracking</title>
    <link rel="stylesheet" href="https://myjeebly.jeebly.com/assets/tracking_css_js/style/style.css?v=2">
  </head>

<body class="orders_row-1">

    <header>
        <nav>
          <div class="company-logo">
            <img src="https://myjeebly.jeebly.com/assets/images/logo.svg" alt="">
          </div>
        </nav>
	</header>
	 <form action="https://myjeebly.jeebly.com/shipment-tracking/" name="track_shipment" method="get" autocomplete="off" enctype="multipart/form-data" enctype="multipart/form-data" accept-charset="utf-8">
	 	<section class="tracking-section jebblysec">
	  <div class="container-fluid">	
        <h1>Track the Joy</h1>
		<div class="row">
          <div class="col-md-12">
            <div class="selectcountry">
              <div class="radio-buttons">
                <div class="custom-radio" >
                    <input type="radio" id="uae" name="uae" value="uae"  checked />
                  <label class="radio-btn " >
                    <div class="hobbies-icon">
                      <img src="https://myjeebly.jeebly.com/assets/images/uae.webp" class="w-100">
                      <h3 class="">UAE</h3>
                    </div>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="service-type col-md-12">
            <div class="main-button d-flex">
				<div>
					<div class="button button-express express-but">
					  <input type="radio" id="a25" name="service_type" value="Express"   />
					  <label class="btn btn-default" for="a25"> Express Delivery</label>
					</div>
					<div class="button button-express">
					  <input type="radio" id="a26" name="service_type" value="Scheduled" checked required />
					  <label class="btn btn-default" for="a26"> Scheduled Delivery</label>
					</div>
					<div class="button button-express">
					  <input type="radio" id="a27" name="service_type" value="Moveo"  required />
					  <label class="btn btn-default" for="a27"> Moveo Delivery</label>
					</div>
					
				</div>
            </div>
          </div>
          <div class="tracking-box d-flex col-md-12">
            <div class="tracking-form">
              <input type="text" placeholder="Enter AWB Number" name="awb" value="JB0000000" required>
              <button type="submit">TRACK</button>
            </div>
            
          </div>
          		  
		</div>
	</div>
	</section>
    </form>   
	
    <section class="order_tracking_page mb-5">
        <div class="container-fluid">
            <div class="col-12"></div>
         <div class="row orders_row">
            <div class="col-md-5">
               
				<div class="order-track">
							<p class="references_number">No Shipment Found</p>
							</div>
										</div>
            <div class="col-md-7">
                                
                <h5 class="references_number text-dark-blue d-none text-center show_time mob_none" id="total_hr_h"></h5>
                            </div>
        </div>
        </div>
    </section>
	    <div class="bg-image-2">
      <img src="https://myjeebly.jeebly.com/assets/images/u-01.png" alt="">
    </div>
    <section class="contact-section">
      <input type="hidden" id="c_code" name="c_code" value="+971">
      <input type="text" autocomplete="off" class="form-control only-numbers" name="shipperphone" id="shipperphone" placeholder="Mobile Number" value="+971">
    </section>
</body>
</html>
