<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Jetline Couriers Pvt. Ltd.</title>
</head>
<body>
    <form name="form1" method="post" action="./" id="form1">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="SYNTHETICVIEWSTATE0000000000000000" />

<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="00000000" />
<input type="hidden" name="__EVENTVALIDATION" id="__EVENTVALIDATION" value="SYNTHETICEVENTVALIDATION0000000000" />
        <div class="main">
            <main class="content">
                <div class="wrapper">
                    <div class="cols">
                        <div class="col_right">
                            <!-- Track Shipment Card -->
                            <div class="login_box1" id="Div1">
                                <h2>Track Your Shipment</h2>
                                <ul>
                                    <li>
                                        <label for="txtAwbNo">Enter AWB No. <em>*</em></label>
                                        <input name="txtAwbNo" type="text" id="txtAwbNo" placeholder="e.g. 000000000" />
                                    </li>
                                    <li>
                                        <div style="text-align: center; margin-top: 10px;">
                                            <input type="submit" name="btnTrack" value="Track Package" onclick="javascript:WebForm_DoPostBackWithOptions(new WebForm_PostBackOptions(&quot;btnTrack&quot;, &quot;&quot;, true, &quot;aa&quot;, &quot;&quot;, false, false))" id="btnTrack" class="btn-primary" />
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <!-- Pincode Search Card -->
                            <div class="login_box1" id="Div6">
                                <h2>Pincode Serviceability</h2>
                                <ul>
                                    <li>
                                        <label for="txtpincode">Enter Pincode <em>*</em></label>
                                        <input name="txtpincode" type="text" id="txtpincode" placeholder="e.g. 000000" />
                                    </li>
                                    <li>
                                        <div style="text-align: center; margin-top: 10px;">
                                            <input type="submit" name="Button1" value="Check Pincode" onclick="javascript:WebForm_DoPostBackWithOptions(new WebForm_PostBackOptions(&quot;Button1&quot;, &quot;&quot;, true, &quot;aaa&quot;, &quot;&quot;, false, false))" id="Button1" class="btn-primary" />
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <!-- Client Login Card -->
                            <div class="login_box1" id="Div2">
                                <h2>Client Login</h2>
                                <ul>
                                    <li>
                                        <label for="txtUserName">User Name <em>*</em></label>
                                        <input name="txtUserName" type="text" id="txtUserName" placeholder="Client Username" />
                                    </li>
                                    <li>
                                        <label for="txtPassword">Password <em>*</em></label>
                                        <input name="txtPassword" id="txtPassword" type="password" placeholder="••••••••" />
                                    </li>
                                    <li>
                                        <div style="text-align: center; margin-top: 14px;">
                                            <input type="submit" name="btnLogin" value="Login to Portal" onclick="javascript:WebForm_DoPostBackWithOptions(new WebForm_PostBackOptions(&quot;btnLogin&quot;, &quot;&quot;, true, &quot;bb&quot;, &quot;&quot;, false, false))" id="btnLogin" class="btn-primary" />
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </form>
</body>
</html>
