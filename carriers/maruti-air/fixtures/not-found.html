    <script type="text/javascript">

        function rotateImage(_direction, _imgViewFile, _rotation) {
            try {
                const rotated = document.getElementById(_imgViewFile);
                let rotation = Number(document.getElementById(_rotation).innerText);
                const angle = 90;
                if (_direction == 'clockWise') {
                    rotation = (rotation + angle) % 360;
                    rotated.style.transform = `rotate(${rotation}deg)`;
                    document.getElementById(_rotation).innerText = rotation;
                }
                else if (_direction == 'counterClockWise') {
                    rotation = (rotation - angle) % 360;
                    rotated.style.transform = `rotate(${rotation}deg)`;
                    document.getElementById(_rotation).innerText = rotation;
                }
            }
            catch (e) {
                console.log(e)
            }
        }

    </script>
