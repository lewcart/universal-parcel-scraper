<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Αναζήτηση αποστολής | Pack-Man</title>
<link rel="canonical" href="https://pack-man.gr/anazitisi-apostolis.html">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<main id="main">
<section class="section">
  <div class="shell">

    <!-- ── Φόρμα ─────────────────────────────────────────── -->
    <div class="waybill rv" style="max-width:860px;margin-inline:auto">
      <div class="waybill-head">
        <span>ΣΥ.ΔΕ.ΤΑ · Αναζήτηση</span>
                  <span class="live">Live tracking ενεργό</span>
              </div>
      <div class="waybill-body single">
                <form class="track-form" id="trackForm" action="/anazitisi-apostolis.html" method="get">
          <div class="track-field">
            <label for="code">Κωδικός αναζήτησης</label>
            <input type="text" id="code" name="code" value="A-00000031"
                   placeholder="π.χ. A-00000000" inputmode="latin" autocomplete="off"
                   spellcheck="false" maxlength="30" required >
          </div>
          <button class="btn btn-solid" type="submit">
            Αναζήτηση
          </button>
        </form>
        <p class="track-err" role="alert"></p>
        <p class="track-note">Τον κωδικό τον έχεις στο SMS που σου στείλαμε ή στην απόδειξη παραλαβής.
          Αν δεν τον βρίσκεις, κάλεσέ μας στο <a href="tel:+302100000000" class="mono">210 0000 000</a>.</p>
              </div>
    </div>

    <!-- ── Αποτέλεσμα ────────────────────────────────────── -->
          <div id="result" style="max-width:860px;margin:34px auto 0">

                  <div class="alert alert-err" role="alert">Δεν βρέθηκε αποστολή με αυτόν τον κωδικό. Έλεγξε τον κωδικό ή κάλεσέ μας.</div>

              </div>
    
  </div>
</section>
</main>
<footer class="site-footer">
  <p class="foot-legal">ΔΕΙΓΜΑ ΙΚΕ</p>
</footer>
</body>
</html>
