                        <h3 class="logo-title logo-title--desktop">Delivery Tracking</h3>
                    </div>
                      <div class="cell small-6 large-4 text-right">
                            <div id="google_translate_element"></div>
                            <button class="button button--translate notranslate" type="button" data-toggle="language-dropdown"><span id="selected-language"></span></button>
                            <div class="dropdown-pane bottom right" id="language-dropdown" data-dropdown data-close-on-click	>
                                <ul class="menu menu--translate vertical text-left notranslate">
                                    <li><a href="#en" onclick="doGTranslate('en|en')" id="lang-en" title="English"><img src="/themes/user/procarrier/img/flags/svg/en.svg" alt="en" /> English</a></li>
                                    <li><a href="#fr" onclick="doGTranslate('en|fr')" id="lang-fr" title="Français"><img src="/themes/user/procarrier/img/flags/svg/fr.svg" alt="fr" /> Français</a></li>
                                </ul>
                            </div>
                          <h3 class="logo-title logo-title--mobile">Delivery Tracking</h3>
                      </div>
                </div>
            </div>
        </header>

                  <section class="hero" style="background-image: url('https://tracker-content-silo.ams3.cdn.digitaloceanspaces.com/cms-files/hero-ecommerce-overlay_%281%29_1.jpg'); " >
   <div class="grid-container">
       <div class="grid-x align-middle">
           <div class="cell large-12">
               <h1>
                    Track <span>your order</span>
                 </h1>
                  <p>To check the status of your order simply enter your tracking number below. This can be found in your dispatch email.</p>
               <form action="/" method="GET" class="track-shipment-form">
                   <input type="text" class="track-shipment-form__tn" name="tn" required >
                   <button class="track-shipment-form__button"><span>Track</span></button>
               </form>

               <div class="switch-service switch-service--returns">
                 <a href="/returns">Need to track a return?</a>
               </div>
           </div>
       </div>
   </div>
</section>


                  <div class="callout callout--fixed alert" data-closable>
                    <h3>Error</h3>
                    <p>Shipment not found (DG00000000000)</p>
                    <button class="close-button" aria-label="Dismiss alert" type="button" data-close>
                      <span aria-hidden="true">&times;</span>
                    </button>
                  </div>

  </main>
