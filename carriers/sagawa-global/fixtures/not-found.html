
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html lang="ja">
<head>
	<title>Shipment Tracking SGX</title>
	<meta name="Robots" content="noindex,nofollow">
	<meta content="SAGAWA GLOBAL EXPRESS" name="description">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<link rel="stylesheet" type="text/css" href="trackeng.css" />
	<script src="analytics.js" type="text/javascript"></script>
	<script src="calendar.js" language="JavaScript"></script>
</head>
<body class='searchboard' onload='pageload()'>
	<div id='PageWrapper'>
		<div id='PageHeader'>
			<div id='PageTitle'>
				<img id='Logo' src='img/sgx2.gif'></img>
				<span>Sagawa Global Tracking</span>
			</div>
		</div>
		<div id='PageContainer'>
			<div id='ContentHeader'>
				<form name='frm' method='post'>
					<input type='hidden' name='ndt' value='2026/06/10'>
					<input type='hidden' name='enc' value='eng'>
					<table>
						<tr>
							<td class='category_block'>
								<div class='category_block'>
									<select id='cat' name='cat' onchange='CategoryChanged( this );'>
										<option value='awb' selected>AWB#</option>
										<option value='ref' >REF#</option>
										<option value='account' >ACCOUNT#</option>
									</select>
								</div>
							</td>
							<td class='value_block'>
								<div class='value_block'>
									<input type='text' name='awb' size='18' maxlength='50' value="300000000005">
								</div>
								<div class='date_block'>
									<input type='text' id='ddate' name='ddate' maxlength='10' size='10' onFocus='wrtCalendarLay( this, event);' value='2026/06/10'>
								</div>
								<div class="search_block">
									<input type="submit" value="SEARCH">
								</div>
							</td>
						</tr>
					</table>
				</form>
			</div>
			<div id="ContentMain">
<div id='ShipmentDetail'><p>No Record.</p></div>
			</div>
			<div id="ContentFooter">
				<div id="ChooseLanguage" style="padding-left:230px;">
					<br />
					
				</div>
			</div>
		</div>
		<div id="PageFooter">
			<div id="HowToUse">
				<h4>Operating Procedures</h4>
				<ol>
					<li>
						<span>Enter the tracking number.</span>
					</li>
					<li>
						<span>Select <span class="Highlight">[AWB#]</span> from the menu and click SEARCH. The search results will be displayed.</span>
					</li>
				</ol>
			</div>
		</div>
	</div>
</body>
</html>
