<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow mb-3">
            <div class="container">
                <div class="row justify-content-center p-0">
                    <img src="/img/mobilogo.jpg" width="213" height="50" alt="Logo">
                </div>
             </div>
</nav>
    </header>

    <div class="container">
        <main role="main" class="pb-3">
            



<script src="/lib/jquery/dist/jquery.min.js"></script>

<script type="text/javascript">

    function displayBusyIndicator() {
        $('.loading').show();
    }
    function hideBusyIndicator() {
        $('.loading').hide();
    }
    $(window).on('beforeunload', function () {
        displayBusyIndicator();
    });
    $(document).on('submit', 'form', function () {
        displayBusyIndicator();
    });
    $('document').bind('beforeunload', function () {
        //do something
        hideBusyIndicator();
    });
</script>






<section class="intro">
    <div class="backimg">
        <div class="mask d-flex align-items-center" style="background-color: rgba(255, 255, 255, 0.1);">
            <div class="container">
                
<div class="loading" >
    Loading&#8230;
</div>



                <div class="card mask-custom p-1 mt-1 mb-2">
                    <div class="card-body">
                        <p class="h3 font-weight-bold mb-4 text-dark">Enter Parcel Number To Track</p>
                        <form role="form" id="form-buscar">
                            <div class="row justify-content-center">
                                <div class="col-md-10 mb-3 mb-md-0">
                                    <div id="basic" class="form-outline form-white">
                                        <input type="text" id="txtpareclId" class="form-control form-control-lg" name="ParcelId"  required />
                                        <label class="form-label" for="form1">Enter your tracking number</label>
                                        <div id="dvInfo" class="text-center justify-content-center"
                                             style="font-weight: bold; color:crimson">
                                            <h4 class="text-danger"> No tracking record found</h4>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <input type="submit"  id="btnSearch" class="btn btn-danger btn-block btn-lg" value="Search" />
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

        </main>
    </div>
