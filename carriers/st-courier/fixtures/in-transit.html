					</div>

		<section style="padding-top: 3rem !important;padding-bottom: 3rem !important;">

							<div class="form-group mb-2">
								<div class="input-group">
									<input type="text" placeholder="Enter AWB Number" class="form-control" name="awb_no" id="awb_no" maxlength="11" required value="">

								</div>
								<div class="text-danger" id="track_error_msg"></div>
							</div>
						</form>
					</div>
				</div>
				<div class="row">
											<div class="col-md-4">
														<div class="table-responsive">
								<table class="table-bordered table font-12 color-bordered-table warning-bordered-table">
									<thead>
										<tr>
											<th class="text-center uppercase" colspan="2">Delivery Status</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td width="35%">Current Status</td>
											<td width="65%" class="font-normal">In Transit</td>
										</tr>
										<tr>
											<td>Orgin SRC</td>

										</tr>
										<tr>
											<td>Destination </td>
											<td class="font-normal"></td>
										</tr>
										<tr>
											<td>Consignment </td>
											<td class="font-normal"></td>
										</tr>
																				
																															</tr>
																				</tbody>
								</table>
															</div>
						</div>
						<div class="col-md-8">

								<div class="E31hUP tl19" style="position:relative;margin-bottom:20px;">
										<div class="94MY69h" style="float:left;text-align:right;position:relative;width:25%;padding:15px 15px 15px 0px;">

										</div>
								</div><div class="E31hUP tl19" style="position:relative;margin-bottom:20px;">
										<div class="94MY69h" style="float:left;text-align:right;position:relative;width:25%;padding:15px 15px 15px 0px;">

			</div>
		</section>
		<!-- Large Modal -->

		<div class="modal fade" id="complaintModalLg" tabindex="-1" aria-labelledby="complaintModalLgLabel" aria-hidden="true">
					<form id="complaintFormLg">
								<div class="col-md-6 mb-3">
									<label class="form-label">Receiver Name</label>
									<input type="text" class="form-control" name="rname" placeholder="Enter your name">
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Booking Date</label>
									<input type="text" name="bk_date" class="form-control bg-gray" value="2026-10-20 21:03:14" readonly>
								</div>

								<div class="col-md-6 mb-3">
									<label class="form-label">AWB No</label>

								<div class="col-md-6 mb-3">
									<label class="form-label">Receiver Phone Number</label>
									<input type="number" name="rphone_no" class="form-control" placeholder="Enter phone number">
								</div>
								<div class="g-recaptcha" data-sitekey="SYNTHETIC-SITE-KEY-0000000000000000000000"></div>

		</div>
