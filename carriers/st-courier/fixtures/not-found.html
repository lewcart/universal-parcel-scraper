<!DOCTYPE html>
<html lang="en">

<head>
	    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Track Your Shipment | ST COURIER PVT LTD</title>
	<link href="https://stcourier.com/css/style.css" rel="stylesheet">
</head>

<body>
		<section class="breadcrumbs">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h1 class="breadcrumb-title">Track Your Shipment</h1>
					</div>
				</div>
			</div>
		</section>
		<section style="padding-top: 3rem !important;padding-bottom: 3rem !important;">
			<div class="container">
				<div class="row mb-5">
					<div class="col-md-6">
						<form class="track_form" action="https://stcourier.com/track/doCheck" id="track_form" method="post" autocomplete="off">
							<div class="form-group mb-2">
								<div class="input-group">
									<input type="text" placeholder="Enter AWB Number" class="form-control" name="awb_no" id="awb_no" maxlength="11" required value="">
									<button class="btn btn-danger" type="submit" id="track" style="background-color:#de200b;"><i class="bi bi-arrow-clockwise mr-2" style="font-size:20px;line-height:1;vertical-align:middle;"></i> Search</button>
								</div>
								<div class="text-danger" id="track_error_msg"></div>
							</div>
						</form>
					</div>
				</div>
				<div class="row">
											<div class="col-md-12">
							<h4 class="text-danger">Sorry, Invalid AWB Number..! (90000000099)</h4>						</div>
									</div>
			</div>
		</section>
		<!-- Large Modal -->

		<div class="modal fade" id="complaintModalLg" tabindex="-1" aria-labelledby="complaintModalLgLabel" aria-hidden="true">
					<form id="complaintFormLg">
								<div class="col-md-6 mb-3">
									<label class="form-label">Receiver Name</label>
									<input type="text" class="form-control" name="rname" placeholder="Enter your name">
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Booking Date</label>
									<input type="text" name="bk_date" class="form-control bg-gray" value="" readonly>
								</div>

								<div class="col-md-6 mb-3">
									<label class="form-label">AWB No</label>
									<input type="text" name="awb_no_comp" class="form-control bg-gray" value="90000000099" readonly>
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Receiver Phone Number</label>
									<input type="number" name="rphone_no" class="form-control" placeholder="Enter phone number">
								</div>
								<div class="g-recaptcha" data-sitekey="SYNTHETIC-SITE-KEY-0000000000000000000000"></div>
					</form>
		</div>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
	<div class="modal fade" id="podModal" tabindex="-1" role="dialog" aria-labelledby="modalLabel2" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title" id="modalLabel2">POD Image</h6>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-12" id="url_pod"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>

</html>
