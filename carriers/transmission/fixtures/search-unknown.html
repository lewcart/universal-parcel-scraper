<!DOCTYPE html>
<html>
   <head>
            <title>TransMission - Zoek uw zending</title>
      <meta charset='UTF-8'>
      <meta name="application-name" content="api01" />
      <meta name="language" content="NL, Nederlands, Dutch" />
   </head>
   <body>
      <a class="sr-only sr-only-focusable" href='#main-content-area'>Skip to main content</a>
<!-- alert Message -->
 <div class=" alert alert-warning  alert-dismissible fade show" role='alert'>
    <div class='d-flex '>
       <div class=" mr-3"><i class="fa  fa-exclamation-circle" aria-hidden='true'></i></div>
       <div  class='align-self-center content'>
               <h6>Let op!</h6>
               <p class='mb-0'>Geen geldig zendingnummer</p>
       </div>
       <div  class='align-self-center  ml-auto'>
          <button type="button" class="close" data-dismiss="alert" aria-label='Close'>
             <span aria-hidden='true'></span>
          </button>
       </div>
    </div>
 </div>
 <!-- alert Message -->
<div class='main-container mb-0'>
    <div class="login-section d-block" id='main-content-area'>
            <div class='container p-5p'>
                    <div class='row content d-flex justify-content-center m-auto  align-content-center flex-wrap'>
                            <div class='col-md-8 col-lg-6'>
                                    <div class='card '>
                                            <div class='card-body p-0'>
                                                    <form class='' method='post'>
                                                            <div class='col-12 p-0'>
                                                                    <h2>Zoek uw zending</h2>
                                                            </div>
                                                            <div class='form-group mb-3'>
                                                                    <label for="text" class='form-label'>Zendingnummer of Vrachtbriefnummer</label>
                                                                    <div class='inputWithIcon'>
                                                                            <input type="text" name="shipment_id" placeholder="" class='input-box-shadow' value="T00000000000000">
                                                                    </div>
                                                            </div>
                                                            <div class='form-group'>
                                                                    <label for="text" class='form-label'>Postcode</label>
                                                                    <div class='inputWithIcon '>
                                                                            <input type="text" name="zipcode" placeholder="" class='input-box-shadow' value="1234AB">
                                                                    </div>
                                                            </div>
                                                            <div class="form-row mt-4 "> <a class='theme-btn theme-btn-primary btn-block btn-padding-lg tms-submit'>Zoek</a>
                                                            </div>
                                                    </form>
                                            </div>
                                    </div>
                            </div>
                    </div>
            </div>
    </div>
</div>
      <div class="modal fade theme-modal" data-backdrop="static" id="default_alert" tabindex="-1" role="dialog" aria-labelledby="default_alert" aria-hidden="true">
          <div class="modal-dialog modal-lg">
              <div class="modal-content">
                  <div class="modal-header" id="default_alert_header">
                      <h4 class="modal-title" id="default_alert_label">Melding</h4>
                  </div>
                  <div class="modal-body scrollbar overflow-x-hidden" id="default_alert_content"></div>
              </div>
          </div>
      </div>
   </body>
</html>
